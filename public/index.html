<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event</title>
  <meta name="theme-color" content="#B83B26" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div id="mp3-player" class="mp3-player" aria-label="Music player" hidden>
    <div class="mp3-header" id="mp3-toggle">
      <span class="mp3-emoji" id="mp3-emoji">🎵</span>
      <span class="mp3-label" id="mp3-label">Playlist</span>
      <span class="mp3-chevron" id="mp3-chevron">▲</span>
    </div>
    <div class="mp3-panel" id="mp3-panel">
      <div class="mp3-track" id="mp3-track">No track loaded</div>
      <div class="mp3-controls">
        <button type="button" id="mp3-prev" title="Previous">⏮</button>
        <button type="button" id="mp3-play" title="Play / Pause">▶</button>
        <button type="button" id="mp3-next" title="Next">⏭</button>
      </div>
      <input type="range" id="mp3-volume" min="0" max="1" step="0.05" value="0.3" title="Volume" />
    </div>
  </div>

  <header id="site-chrome" class="site-chrome" hidden>
    <button type="button" id="nav-home" class="site-home">← Home</button>
    <div class="site-brand">
      <span id="chrome-emoji"></span>
      <span id="chrome-name"></span>
    </div>
  </header>

  <main class="app">

    <section id="screen-home" class="screen home-screen active">
      <img id="home-hero" class="hero-image" alt="" hidden />
      <p class="home-kicker" id="home-kicker"></p>
      <h1 class="home-title">
        <span id="home-emoji" class="home-emoji"></span>
        <span id="home-name">Loading…</span>
      </h1>
      <p class="home-desc" id="home-description"></p>
      <nav id="home-nav" class="home-nav" aria-label="Event menu"></nav>
    </section>

    <section id="screen-guestbook" class="screen card">
      <h1 class="title" id="guestbook-title">Guest book</h1>
      <p class="lead" id="guestbook-lead">Leave a short note for the hosts.</p>
      <form id="guestbook-form" class="name-form" novalidate>
        <label for="guestbook-name" class="field-label">Your name</label>
        <input id="guestbook-name" class="text-input" type="text" maxlength="30"
               placeholder="Enter your name…" autocomplete="name" />
        <label for="guestbook-message" class="field-label" style="margin-top:14px">Your message</label>
        <textarea id="guestbook-message" class="text-input guestbook-message" maxlength="280"
                  placeholder="Write a short message…" rows="3"></textarea>
        <p id="guestbook-error" class="error-text" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block">Sign the guest book</button>
      </form>
      <div id="guestbook-list" class="guestbook-list"></div>
    </section>

    <section id="screen-gallery" class="screen card">
      <h1 class="title">Gallery</h1>
      <p class="lead">Photos and clips from the event.</p>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <section id="screen-hof" class="screen card">
      <h1 class="title">Hall of Fame</h1>
      <p class="lead">The quiz leaderboard.</p>
      <div id="hof-home-rows" class="hof-rows">
        <div class="hof-loading">Loading…</div>
      </div>
    </section>

    <section id="screen-welcome" class="screen card">
      <img id="welcome-hero" class="hero-image" alt="" hidden />
      <h1 id="welcome-title" class="title">Quiz</h1>
      <p id="welcome-subtitle" class="subtitle"></p>
      <p id="welcome-message" class="lead"></p>
      <form id="name-form" class="name-form" novalidate>
        <label for="player-name" class="field-label">What's your name?</label>
        <input id="player-name" class="text-input" type="text" maxlength="30"
               placeholder="Enter your name…" autocomplete="off" />
        <p id="name-error" class="error-text" role="alert" hidden>Please enter your name to start.</p>
        <button type="submit" class="btn btn-primary btn-block">Start Quiz →</button>
      </form>
    </section>

    <section id="screen-quiz" class="screen card">
      <div class="progress-head">
        <span id="progress-label" class="progress-label">Question 1 of 1</span>
        <span id="progress-by" class="progress-by"></span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div id="question-anim" class="question-anim">
        <img id="question-image" class="question-image" alt="" hidden />
        <h2 id="question-text" class="question-text"></h2>
        <div id="options" class="options"></div>
      </div>
      <button id="next-btn" class="btn btn-primary btn-block" type="button" disabled>Next</button>
    </section>

    <section id="screen-results" class="screen card">
      <h1 id="tier-title" class="title"></h1>
      <div class="score-ring">
        <span id="score-percent" class="score-percent">0%</span>
        <span id="score-raw" class="score-raw">0 / 0</span>
      </div>
      <p id="tier-message" class="lead"></p>
      <div id="hall-of-fame" class="hall-of-fame">
        <h3 class="hof-title">🏆 Hall of Fame 🏆</h3>
        <div id="hof-rows" class="hof-rows">
          <div class="hof-loading">Loading…</div>
        </div>
      </div>
      <button id="play-again-btn" class="btn btn-secondary btn-block" type="button">Play Again ↺</button>
      <button id="results-home" class="btn btn-primary btn-block" type="button">Back to event home</button>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
